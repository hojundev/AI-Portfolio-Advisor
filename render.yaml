# Render Blueprint — deploys the whole product from the repo root.
#   1. FastAPI quant engine (spectral optimizer + Gemini insight)
#   2. The Vite frontend as a static site
# After the first deploy: copy folio-quant-api's public URL into the
# folio-web service's VITE_BACKEND_URL env var (Render dashboard) and
# redeploy the static site — the SPA reads it at build time.

services:
  - type: web
    name: folio-quant-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /
    envVars:
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: folio-web
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: dist
    envVars:
      # point the SPA at the deployed quant API (set to folio-quant-api's URL)
      - key: VITE_BACKEND_URL
        sync: false
